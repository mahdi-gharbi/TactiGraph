services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: tactigraph
      POSTGRES_USER: tactigraph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-research-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tactigraph -d tactigraph"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "127.0.0.1:${TACTIGRAPH_HOST_PORT:-8000}:8000"
    environment:
      TACTIGRAPH_DATABASE_URL: postgresql+psycopg://tactigraph:${POSTGRES_PASSWORD:-local-research-only}@db:5432/tactigraph
      TACTIGRAPH_MODE: local
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TACTIGRAPH_GROQ_MODEL: openai/gpt-oss-20b
    volumes:
      - match-data:/app/data
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
  match-data:
